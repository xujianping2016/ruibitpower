<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ruibit Power CMS</title>
    <!-- This page is not content. It is excluded from the sitemap and
         also carries the directive in its own head, so a crawler that
         ignores Netlify's X-Robots-Tag still stays out. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <script>
      /* OAuth callback handler: runs before Decap loads.
         After GitHub auth, our worker redirects here with #token=...
         If we're in a popup, send token to opener and close.
         If we're in the main window, fetch user info, store, and reload. */
      (function () {
        var hash = window.location.hash;
        if (!hash || hash.indexOf('token=') === -1) return;
        var params = new URLSearchParams(hash.slice(1));
        var token = params.get('token');
        if (!token) return;

        if (window.opener) {
          /* Popup mode: hand the token to the main window. */
          window.opener.postMessage({ type: 'AUTH_SUCCESS', token: token }, window.location.origin);
          window.close();
          return;
        }

        /* Full-page redirect (popup was blocked): fetch user, store, reload. */
        fetch('https://api.github.com/user', {
          headers: { Authorization: 'token ' + token, 'User-Agent': 'ruibitpower-decap' }
        })
          .then(function (r) { return r.json(); })
          .then(function (user) {
            var record = { token: token, login: user.login, name: user.name || user.login };
            localStorage.setItem('decap-cms-user', JSON.stringify(record));
            window.location.hash = '';
            window.location.reload();
          })
          .catch(function () {
            /* If the API call fails, still store the bare token and reload. */
            localStorage.setItem('decap-cms-user', JSON.stringify({ token: token }));
            window.location.hash = '';
            window.location.reload();
          });
      })();
    </script>
  </head>
  <body>
    <!-- Pinned to one exact release: a caret range let the CDN serve any future
         3.x build into this page without a deploy on our side. The integrity
         hash is of that exact file, so a substituted or tampered bundle is
         refused by the browser rather than executed. When upgrading, change
         both the version and the hash together. -->
    <script
      src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"
      integrity="sha384-A/Gdn928CNLufmnGWGs9RM4Q9o8bSNLeJERqBFrBjwzL7FRpoLT3MPF8Tl0+Wd2p"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </body>
</html>
